<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PEAnalyze</title>
  <meta name="description" content="Suivi personnel de PEA en ETF : portefeuille, historique, marchés et simulateur.">
  <meta name="theme-color" content="#0F1519">
  <meta name="color-scheme" content="light dark">
  <script>window.__t0=Date.now();try{var t=localStorage.getItem('peanalyze:theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PEAnalyze">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* écran de démarrage : affiché dès le premier rendu, avant que le CSS et le JS soient chargés */
    html{background:#FFFFFF}
    html[data-theme="dark"]{background:#0F1519}
    body{margin:0}
    /* toujours sombre, comme le fond du splash Android (manifest) : aucun éclair blanc au lancement, quel que soit le thème */
    .splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#0F1519;transition:opacity .35s ease}
    .splash.out{opacity:0;pointer-events:none}
    .splash .mark{width:88px;height:88px;border-radius:24px;background:#00806A;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,128,106,.28);animation:splash-pulse 1.5s ease-in-out infinite}
    .splash path{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:splash-draw 1.5s ease-in-out infinite}
    @keyframes splash-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @keyframes splash-draw{0%{stroke-dashoffset:40}60%,100%{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.splash .mark,.splash path{animation:none}.splash path{stroke-dashoffset:0}}
  </style>
  <link rel="stylesheet" href="app.css">
  <!-- polices : chargées sans bloquer l'affichage -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600;700&display=swap"></noscript>
</head>
<body>
  <div id="root"></div>
  <div id="splash" class="splash" role="status" aria-label="PEAnalyze"><div class="mark"><svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg></div></div>
  <noscript>PEAnalyze a besoin de JavaScript.</noscript>
  <script>
    /* réparation automatique : si l'application ne démarre pas (fichiers de deux versions mélangés dans le cache), on vide le cache de l'application et on recharge, une seule fois */
    (function(){
      var K='pea:heal';
      function fix(manual){
        try{ if(!manual){ if(sessionStorage.getItem(K)) return ask(); sessionStorage.setItem(K,'1'); } }catch(e){}
        var jobs=[];
        if(navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));}));
        if(window.caches) jobs.push(caches.keys().then(function(k){return Promise.all(k.filter(function(n){return n.indexOf('pea-shell-')===0;}).map(function(n){return caches.delete(n);}));}));
        Promise.all(jobs).catch(function(){}).then(function(){return fetch('./',{cache:'reload'}).catch(function(){});}).then(function(){location.reload();});
      }
      function ask(){
        var s=document.getElementById('splash'); if(!s||document.getElementById('heal-btn')) return;
        var d=document.createElement('div'); d.style.cssText='position:absolute;left:0;right:0;bottom:15%;text-align:center;color:#fff;font:14px system-ui,sans-serif;padding:0 24px';
        d.innerHTML='L\u2019application n\u2019a pas pu d\u00e9marrer.<br><button id="heal-btn" style="margin-top:12px;padding:12px 20px;border:0;border-radius:999px;background:#00806A;color:#fff;font:600 14px system-ui,sans-serif">R\u00e9parer et recharger</button>';
        s.appendChild(d); document.getElementById('heal-btn').onclick=function(){fix(true);};
      }
      window.__peaHeal=fix;
      window.addEventListener('error',function(e){ if(e.target&&e.target.tagName==='SCRIPT') fix(); },true);
      window.addEventListener('unhandledrejection',function(e){ var m=String(e.reason&&(e.reason.message||e.reason)); if(/dynamically imported module|Importing a module script|ChunkLoad/i.test(m)) fix(); });
      setTimeout(function(){ if(document.getElementById('splash')) fix(); },12000);
    })();
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
